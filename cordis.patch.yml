# dsh-branchman — bundle patch for DeepSeek Harness.
#
# Inserted into the profile's loader config when the package is listed in
# `dsh.profile.bundles`. `dataFile` lands under $DSH_HOME so tree metadata
# survives restarts.
#
# Repository identity comes from the source session and Git common-dir.
# Optional gitPath overrides the Git executable (default: PATH's git).
- insert:
    - id: branchman
      name: dsh-branchman
      config:
        dataFile: !!js dshHomePath('branchman/tree-v2.json')
