# 发布到 npm —— 用 trusted publishing（OIDC），不需要任何令牌或验证码。
#
# 为什么不用 `npm publish --userconfig=…`：npm 自 2025-11 起只认 granular 令牌，
# 且正在逐步取消「绕过 2FA 的令牌直接发布」（官方公告：bypass-2FA granular access
# tokens 的发布面将缩减为"暂存 + 维护者用 2FA 批准"）。官方推荐的替代就是 OIDC 可信发布。
#
# 一次性准备（在 npmjs.com 上，包首次发布之后）：
#   https://www.npmjs.com/package/dsh-branchman/access → Trusted Publisher
#     Organization or user : mydsp
#     Repository           : dsh-branchman
#     Workflow filename    : publish.yml
#     Environment          : （留空）
#
# 之后发版：Actions 页面手动触发本工作流（或在本仓库创建 Release）即可。
# 发布产物自动带 provenance 签名，npm 页面上会显示"来自此仓库构建"。
name: publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只打包不发布（验证用）
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC：trusted publishing 与 provenance 都依赖它

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # trusted publishing 要求 npm CLI >= 11.5.1、node >= 22.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install locked build dependencies
        run: npm ci

      # 发布前编译、构建并执行完整测试。
      - run: npm test

      - name: 核对将要发布的文件
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          git diff --exit-code -- index.js client.js

      - name: 发布（OIDC，无需令牌）
        run: |
          version=$(node -p "require('./package.json').version")
          npm publish "$RUNNER_TEMP/dsh-branchman-$version.tgz" --ignore-scripts --provenance --access public ${{ inputs.dry-run && '--dry-run' || '' }}
